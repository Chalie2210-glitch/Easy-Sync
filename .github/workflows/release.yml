name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = python -c 'from easysync.version import VERSION; print(VERSION)'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build
        env:
          PYTHONUTF8: '1'
        run: ./packaging/build.ps1
      - name: Verify packaged startup
        env:
          PYTHONUTF8: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $PWD 'build/startup.json'
          $app = Start-Process -FilePath './dist/EasySync/EasySync.exe' -ArgumentList @('--smoke-test', $report) -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id; throw 'Application startup timed out' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0 -or -not $result.visible) { throw ($result | ConvertTo-Json) }
      - name: Verify installed Explorer integration and repair
        shell: pwsh
        run: |
          $version = python -c 'from easysync.version import VERSION; print(VERSION)'
          $installer = Join-Path $PWD "dist/release/Easy-Sync-Setup-$version-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'Easy Sync 한글 설치'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'EasySync-Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'EasySync-Local'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $moduleHandle = [IntPtr]::Zero
          try {
            foreach ($attempt in 1..2) {
              $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=shellmenu', "/DIR=`"$installDir`"") -WindowStyle Hidden -PassThru
              if (-not $setup.WaitForExit(120000)) { throw 'Installer timed out' }
              if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
              $report = Get-Content -LiteralPath "$env:LOCALAPPDATA/EasySync/Logs/integration-shell.json" -Raw | ConvertFrom-Json
              if (-not $report.ok) { throw ($report | ConvertTo-Json) }
              $config = Get-ItemProperty 'HKCU:\Software\EasySync\ShellImport'
              if ($config.Program -ne "$installDir\EasySync.exe" -or $config.Script -ne '') { throw 'Menu still references a development launcher' }
              if ($attempt -eq 1) {
                $moduleName = (Get-Content -LiteralPath "$installDir/_internal/easysync-shell-host.txt" -Raw).Trim()
                $moduleHandle = [System.Runtime.InteropServices.NativeLibrary]::Load("$installDir/_internal/$moduleName")
              }
            }
          } finally {
            if ($moduleHandle -ne [IntPtr]::Zero) { [System.Runtime.InteropServices.NativeLibrary]::Free($moduleHandle) }
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -PassThru
              if (-not $remove.WaitForExit(60000) -or $remove.ExitCode -ne 0) { throw 'Uninstall failed' }
            }
          }
          if (Test-Path -LiteralPath "$installDir/EasySync.exe") { throw 'Uninstall left the application behind' }
          if (Test-Path 'HKCU:\Software\EasySync\ShellImport') { throw 'Uninstall left shell registration behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Sync-Windows-x64
          path: dist/release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Easy-Sync-Windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Easy Sync $GITHUB_REF_NAME" --notes-file CHANGELOG.md
