name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests_release -v
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = python -c 'from easysync.version import VERSION; print(VERSION)'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build
        env:
          PYTHONUTF8: '1'
        run: ./packaging/build.ps1
      - name: Verify installer
        env:
          PYTHONUTF8: '1'
        run: python packaging/verify_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Sync-Windows-x64
          path: dist/release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Easy-Sync-Windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Easy Sync $GITHUB_REF_NAME" --notes-file CHANGELOG.md
